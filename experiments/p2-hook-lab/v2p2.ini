[hooks]
; Persistent P2 hook configuration (read once at startup in TGL_PluginInit)
; Modes:
;   off    (0) = do not patch (zero runtime overhead, vanilla bytes)
;   prod   (1) = production P2 replacement (PAGE_EXECUTE_READ PIC blob, zero shared globals)
;   shadow (2) = differential shadow-compare (rejected unless target registers a shadow comparator)
;
; Paso B pilot (HighPerfWinClock 0x00A7B0F0 + 0x00A7B490, default off):
fn_00a7b490 = off

; C1a (Country_Recalculate SESE [0x00515EA6, 0x00516286) variant (a) PREFETCHT0, default off):
fn_00515ea6 = off

; V2 (Country_Recalculate SESE [0x00515EA6, 0x00516286) variant (c) compact living-tag bitmask, off | validate | prod):
fn_00515ea6_varc = off
